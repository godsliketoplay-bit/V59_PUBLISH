/* V59.2 · SET-7 — TÂCHES / FOURCHETTE DE RÉPÉTITION / FOURNISSEUR / DÉC-06

   RÈGLES TENUES :
     • Une tâche n'est ATTENDUE que si sa répétition le dit. Aucun jour où
       elle n'est pas due ne génère d'attente, donc aucune fausse alerte.
     • Un jour fermé reste fermé : aucune attente n'y est produite.
     • « Occasionnel » (active:false) reste distinct de « actif ».
     • AUCUNE conformité n'est calculée ni écrite automatiquement.
     • Un fournisseur est une ENTITÉ stable (supplierId). Le texte historique
       est conservé tel quel : il n'est jamais deviné ni réattribué. */

/* ================= 1. FOURCHETTE DE RÉPÉTITION DES TÂCHES ================= */
var S07_FREQ=['daily','weekly','biweekly','monthly','interval'];
function freqLabel(f){
  f=String(f||'daily');
  return {daily:'Quotidienne',weekly:'Hebdomadaire',biweekly:'Bimensuelle',monthly:'Mensuelle',interval:'Tous les N jours'}[f]||f
}
/* Normalisation ADDITIVE : une tâche existante garde son identité et tous
   ses champs ; seuls les nouveaux (frequency, intervalDays, anchorDate)
   sont ajoutés avec des valeurs par défaut. */
function normaliseCustomTasks(list){
  var out=[];
  (list||[]).forEach(function(t){
    if(!t||typeof t!=='object')return;
    var id=String(t.id==null?'':t.id).trim();
    if(!id)return;                                   /* pas de tâche sans identité */
    var f=S07_FREQ.indexOf(t.frequency)>=0?t.frequency:'daily';
    var n=parseInt(t.intervalDays,10);
    out.push({id:id,
      name:String(t.name==null?'':t.name),
      operation:String(t.operation==null?'':t.operation),
      active:t.active!==false,
      weekdays:Array.isArray(t.weekdays)?t.weekdays.filter(function(w){return w>=0&&w<=6}):[],
      area:String(t.area==null?'':t.area),
      equipmentId:String(t.equipmentId==null?'':t.equipmentId),
      order:typeof t.order==='number'?t.order:99,
      frequency:f,
      intervalDays:(f==='interval'&&n>=2)?n:0,
      anchorDate:/^\d{4}-\d{2}-\d{2}$/.test(String(t.anchorDate||''))?String(t.anchorDate):'',

    });
  });
  return out;
}
function customTaskById(id){
  return normaliseCustomTasks(config.customTasks||[]).filter(function(t){return t.id===id})[0]||null

function isoDayIndex(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));
  if(!m)return NaN;
  return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/86400000);
}
/* La tâche est-elle DUE ce jour-là ? Aucune attente n'est produite sinon. */
function customTaskDueOn(t,iso){
  if(!t||t.active===false)return false;               /* occasionnel ≠ actif */
  if(isNaN(isoDayIndex(iso)))return false;   /* date illisible */
  var d=new Date(String(iso)+'T12:00:00');
  if(isNaN(d.getTime()))return false;
  if(Array.isArray(t.weekdays)&&t.weekdays.length&&t.weekdays.indexOf(d.getDay())<0)return false;
  var start=t.anchorDate&&isoDayIndex(t.anchorDate)>=0?isoDayIndex(t.anchorDate):null;
  var here=isoDayIndex(iso);
  if(start!==null&&here<start)return false;           /* avant l'ancrage : pas attendu */
  var diff=(start!==null)?(here-start):(d.getDay()%7);
  switch(t.frequency){
    case 'weekly':return diff%7===0;
    case 'biweekly':return diff%14===0;
    case 'monthly':return d.getDate()===1||!t.anchorDate;
    case 'interval':return t.intervalDays>=2&&diff%t.intervalDays===0;
    default:return true;                               /* daily */
  }
}
/* Tâches attendues AUJOURD'HUI (jours fermés exclus : rien n'y est attendu). */
function customDailyTasks(){
  var iso=today();
  if(isClosedDate(iso))return [];
  return normaliseCustomTasks(config.customTasks||[]).filter(function(t){return customTaskDueOn(t,iso)})
}
/* ================= 2. HISTORIQUE D'UNE TÂCHE (lecture seule) =================

   aucun JSON brut, aucun identifiant technique affiché. */
function taskHistoryRecords(taskId){
  return records.filter(function(r){
    return r&&r.module==='custom_task'&&r.data&&!r.data.cancelled&&r.data.taskId===taskId

/* ================= 3. FOURNISSEUR : ENTITÉ CANONIQUE =================
   `config.suppliers` passe de liste de TEXTE à liste d'OBJETS.
   Les anciennes valeurs texte sont LUES comme des noms historiques : elles
   ne sont ni supprimées, ni réattribuées, ni devinées. */
function normaliseSuppliers(list){
  var out=[],used={};
  (list||[]).forEach(function(s){
    if(s==null)return;
    var o=null;
    if(typeof s==='string'){
      var n=s.trim();if(!n)return;
      o={name:n,supplierId:'sup_'+newIdentityToken()};
    }else if(typeof s==='object'){
      o={};Object.keys(s).forEach(function(k){o[k]=s[k]});
      var name=String(o.name==null?'':o.name).trim();
      if(!name)return;
      if(!o.supplierId)o.supplierId='sup_'+newIdentityToken();   /* identité neuve */
      o.name=name;
    }else return;
    if(used[o.supplierId])return;                   /* jamais deux fois le même id */
    used[o.supplierId]=1;
    o.archived=o.archived===true;
    o.active=o.archived?false:(o.active!==false);
    if(o.note==null)o.note='';
    if(o.contact==null)o.contact='';
    out.push(o)
  });
  return out
}
function supplierList(){
  if(!Array.isArray(config.suppliers))config.suppliers=[];
  var src=config.suppliers,out=normaliseSuppliers(src),i;
  var changed=(src.length!==out.length);
  for(i=0;!changed&&i<src.length;i++)if(!src[i]||typeof src[i]!=='object'||!src[i].supplierId)changed=true;
  /* l'identite devient stable des ce tour ; la sauvegarde ecritive habituelle l'enregistre */
  if(changed)config.suppliers=out;
  return out
}

/* V59.2 · SET-5 — MENU / PROFIL DE PRÉPARATION / PLAT TÉMOIN / DOSSIER

   DEUX COUCHES À NE JAMAIS CONFONDRE :
     • PROFIL DE PRÉPARATION (`p.ingredientIds`) = les produits que la
       préparation utilise NORMALEMENT. C'est une configuration.
     • TRAÇABILITÉ RÉELLE (`data.lots[]` d'un contrôle de plat) = le lot
       PHYSIQUE effectivement utilisé ce jour-là. C'est un enregistrement.
   Un profil ne exige JAMAIS de lot, et un lot n'est JAMAIS déduit du profil.

   L'identité est toujours stable : `ingredientId`, `preparationId`, `menuItemId`,
   `lot.id`. Jamais une position de tableau, jamais un nom affiché comme clé. */

/* ---- PROFIL DE PRÉPARATION : ids d'ingrédients stables (P20) ---- */
function prepProfileIngredientIds(p){
  if(!p)return [];
  if(Array.isArray(p.ingredientIds)&&p.ingredientIds.length)return p.ingredientIds.slice();
  /* migration LECTURE des anciens profils enregistrés par NOM : le nom est
     résolu UNE fois en identifiant, jamais utilisé comme identité ensuite. */
  var legacy=Array.isArray(p.ingredients)?p.ingredients:[];
  if(!legacy.length)return [];
  return legacy.map(function(n){
    var g=(config.ingredients||[]).filter(function(x){return x&&x.name===n})[0];
    return g?g.ingredientId:''
  }).filter(Boolean)
}
/* Incohérence à rendre visible : un ingrédient archivé reste-listé comme
   configuré, mais n'est plus proposé comme choix actif. */
function prepProfileArchivedIngredients(p){
  return prepProfileIngredientIds(p).filter(function(id){return productArchived(id)})
}
function setPrepProfileIngredients(p,ids){
  var seen={},out=[];
  (ids||[]).forEach(function(id){
    if(!id||seen[id])return;              /* jamais de doublon */
    if(!ingredientById(id))return;        /* produit inconnu : rien n'est inventé */
    seen[id]=1;out.push(id)
  });
  p.ingredientIds=out;
  /* le libellé texte est conservé à jour pour l'affichage et l'export
     historique ; il ne sert PLUS d'identité. */
  p.ingredients=out.map(function(id){var g=ingredientById(id);return g?g.name:''}).filter(Boolean);
  return out
}

/* ---- MENU : un REPAS = un item principal + ses accompagnements ---- */
/* Un accompagnement n'est jamais un repas distinct : il appartient à l'item
   qui le précède dans le menu daté. */
function menuMeals(menu){
  var out=[];
  (menuFilled(menu)||[]).forEach(function(x){
    if(x.side){                                  /* accompaniment */
      var last=out[out.length-1];
      if(last)last.accompagnements.push(x);
      return
    }
    out.push({item:x,accompagnements:[]})
  });
  return out
}
function menuMealLabel(m){
  var parts=[m.item.slot?m.item.slot+' '+m.item.name:m.item.name];
  m.accompagnements.forEach(function(a){parts.push((a.slot?a.slot+' ':'')+a.name)});
  return parts.join(' + ')
}
function menuMealId(m){return m&&m.item&&m.item.id?m.item.id:''}
/* Un repas = l'ensemble des items du menu daté, accompagnements compris. */
function menuMealItems(m){
  var out=[];
  if(m&&m.item)out.push(m.item);
  if(m)m.accompagnements.forEach(function(a){out.push(a)});
  return out
}
/* V59.2 · SET-4 — PRODUIT / RÉCEPTION / LOT / TRAÇABILITÉ

   PRINCIPE : UN produit canonique + PLUSIEURS lots individuels.
   AUCUN second registre : on écrit toujours dans `config.ingredients` et
   `config.traceLots`, les deux magasins DÉJÀ existants.

   Règles non négociables :
   - l'identité d'un produit est `ingredientId`, jamais son nom ni sa position ;
     un renommage PRÉSERVE l'identifiant ;
   - l'identité d'un lot est `id` (`lot_…`), jamais sa position ;
   - `lot.product` (nom) est CONSERVÉ : les enregistrements historiques
     restent lisibles. Le lien stable est `lot.ingredientId` (additif) ;
   - archiver ≠ supprimer : rien n'est jamais effacé ;
   - l'archivage du LOT est indépendant de celui du PRODUIT ;
   - aucun lien n'est inventé : une chaîne incomplète reste visiblement
     incomplète ;

     AUCUN archivage automatique d'un lot périmé. */

/* Recherche courante de l'écran Traçabilité (état de session, pas une donnée
   métier : rien n'est écrit sur le disque par la recherche). */
var Y04_Q='';
/* Fournisseurs : suggestions issues de la configuration EXISTANTE. Sysco et
   Promocash ne restent que des valeurs de départ héritées, jamais une liste
   fermée : la saisie reste libre. */
function supplierDatalist(id){
  var known={};
  /* Fournisseurs ACTIFS uniquement : un fournisseur archive n'est plus propose. */
  activeSuppliers().forEach(function(s){known[s.name]=1});
  /* Les textes historiques restent proposes comme valeurs libres. */
  records.forEach(function(r){if(r&&r.data&&r.data.supplier)known[String(r.data.supplier)]=1});
  (config.ingredients||[]).forEach(function(x){if(x&&x.supplier)known[String(x.supplier)]=1});
  (config.traceLots||[]).forEach(function(x){if(x&&x.supplier)known[String(x.supplier)]=1});
  return '<datalist id="'+id+'">'+Object.keys(known).map(function(s){return '<option value="'+esc(s)+'">'}).join('')+'</datalist>'
}
/* ---- PRODUITS ---- */
function normaliseIngredients(list){
  var out=[];
  (list||[]).forEach(function(ing){
    if(!ing||typeof ing!=='object')return;
    var name=String(ing.name==null?'':ing.name).trim();
    if(!name)return;                                   /* pas de produit sans nom */
    out.push({ingredientId:String(ing.ingredientId==null?'':ing.ingredientId),name:name,
      category:String(ing.category==null?'':ing.category),
      supplier:String(ing.supplier==null?'':ing.supplier),
      storageLocation:String(ing.storageLocation==null?'':ing.storageLocation),
      storageRule:String(ing.storageRule==null?'':ing.storageRule),
      allergens:Array.isArray(ing.allergens)?ing.allergens.slice():[],
      photo:ing.photo||null,
      attachments:Array.isArray(ing.attachments)?ing.attachments.slice():(ing.photo?[ing.photo]:[]),
      photo:ing.photo||null,
      archived:ing.archived===true})
  });
  /* les identifiants manquants sont posés ICI, une seule fois, jamais regénérés */
  out.forEach(function(ing){if(ing.ingredientId)return;   /* jamais regenere */
    var base='ing_'+eqSlug(ing.name),id=base,n=1;
    while(out.some(function(x){return x.ingredientId===id})){n++;id=base+'_'+n}
    ing.ingredientId=id});
  return out
}
function productList(){return normaliseIngredients(config.ingredients||[])}
function activeProducts(){return productList().filter(function(x){return !x.archived})}
function archivedProducts(){return productList().filter(function(x){return x.archived})}
function productArchived(id){var p=ingredientById(id);return !!(p&&p.archived)}

/* ---- LOTS : archivage indépendant + lien produit stable ---- */
function lotExpiryDate(l){return l?String(l.dlc||l.ddm||''):''}
function lotIsArchived(l){return !!(l&&l.archived)}
/* Écart en jours, calculé sur UTC MIDI : aucune dérive de fuseau. */
function lotDaysLeft(l,iso){
  var e=lotExpiryDate(l);if(!e||!/^\d{4}-\d{2}-\d{2}$/.test(e))return null;
  var a=String(iso||today()).split('-'),b=e.split('-');
  if(a.length!==3)return null;
  var da=Date.UTC(+a[0],+a[1]-1,+a[2]),db=Date.UTC(+b[0],+b[1]-1,+b[2]);
  if(isNaN(da)||isNaN(db))return null;
  return Math.round((db-da)/86400000)
}
function lotIsExpired(l,iso){var n=lotDaysLeft(l,iso);return n===null?false:n<0}
/* Fenêtre « à vérifier » : environ 3 jours avant l'échéance, et à l'échéance. */
function lotNeedsCheck(l,iso){var n=lotDaysLeft(l,iso);return n===null?false:(n<=3)}
function lotArchived(l,iso){return lotIsArchived(l)||lotIsExpired(l,iso)}
function normaliseTraceLots(list,products){
  var out=[],plist=Array.isArray(products)?products:(config&&config.ingredients)||[];
  (list||[]).forEach(function(l){
    if(!l||typeof l!=='object')return;
    var o={};
    Object.keys(l).forEach(function(k){o[k]=l[k]});   /* copie : rien n'est perdu */
    if(typeof o.id!=='string'||!o.id)return;          /* pas de lot sans identité */
    o.archived=o.archived===true;
    /* lien produit ADDITIF : résolu une fois par le nom, jamais déduit ni inventé */
    if(!o.ingredientId&&o.product){
      var want=String(o.product).trim();
      var p=plist.filter(function(x){return x&&String(x.name||'').trim()===want})[0];
      if(!p&&ingredientById)p=(config&&config.ingredients||[]).filter(function(x){return x&&x.name===o.product})[0];
      if(p&&p.ingredientId)o.ingredientId=p.ingredientId
    }
    out.push(o)
  });
  return out
}

/* ---- Sélecteur de lot ACTIF : produit · fournisseur · lot · DLC/DDM ---- */
function lotOptionLabel(l){

function activeLotOptions(iso){

function activeLotSelect(id,iso,attrs){

                :'<option value="">— Aucun lot actif —</option>';

/* Sélecteur de PRODUIT actif (archivés exclus). */
function activeProductOptions(){return activeProducts().map(function(p){return {id:p.ingredientId,label:p.name}})}
function activeProductSelect(id,attrs,selected){

                :'<option value="">— Aucun produit actif —</option>';

/* ---- Chaîne de traçabilité : les liens absents restent ABSENTS ---- */
function traceChainForLot(lotId){
  var l=lotById(lotId);
  if(!l)return null;
  var ing=l.ingredientId?ingredientById(l.ingredientId):(l.product?ingredientByName(l.product):null);
  var receptions=records.filter(function(r){return r&&r.module==='deliveries'&&!r.data?.cancelled&&(l.deliveryId?r.id===l.deliveryId:(l.lot&&r.data.lot===l.lot&&(!r.data.product||!l.product||r.data.product===l.product)))});
  var uses=records.filter(function(r){
    if(!r||r.data?.cancelled)return false;
    return Array.isArray(r.data.lots)&&r.data.lots.some(function(x){return x&&x.id===l.id})
  });
  return {
    lot:l,product:ing||null,
    productLinkMissing:!ing,
    reception:receptions.slice(-1)[0]||null,
    uses:uses.slice().reverse(),
    menus:uses.map(function(r){return {iso:r.iso,menuItemId:r.data.menuItemId||null,preparation:r.data.preparation||'',slot:r.data.slot||''}})
  }
}
/* Recherche par produit / fournisseur / n° de lot / DLC-DDM. */
function searchLots(q){
  q=String(q||'').trim().toLowerCase();
  if(!q)return lotList();
  return lotList().filter(function(l){
    var ing=l.ingredientId?ingredientById(l.ingredientId):null;
    var hay=[ing?ing.name:'',l.product||'',l.supplier||'',l.lot||'',l.dlc||'',l.ddm||''].join(' ').toLowerCase();
    return hay.indexOf(q)>=0
  })
}

function lotList(){return normaliseTraceLots(config.traceLots||[])}
function activeLots(iso){
  iso=iso||today();
  return lotList().filter(function(l){return !lotArchived(l,iso)})
}
function lotsOfProduct(ingredientId){return lotList().filter(function(l){return l.ingredientId===ingredientId})}
function lotById(id){return lotList().filter(function(l){return l.id===id})[0]||null}
function lotDisplayName(l){return l&&(l.lot||l.id)}
function lotFullLabel(l){
  var parts=[];
  var ing=(l&&l.ingredientId)?ingredientById(l.ingredientId):null;
  parts.push(ing?ing.name:((l&&l.product)||'Produit'));
  if(l&&l.supplier)parts.push(l.supplier);
  if(l&&l.lot)parts.push('lot '+l.lot);
  var e=lotExpiryDate(l);
  if(l&&l.dlc)parts.push('DLC '+l.dlc);
  if(l&&l.ddm)parts.push('DDM '+l.ddm);
  return parts.join(' · ')
}
/* V59.2 · SET-3 — « À VÉRIFIER » : ATTENTES & DÉCISIONS OPÉRATEUR

   PRINCIPE : le moteur d'alerte est un mécanisme ATTENTE / RÉALISATION.
   Il dit « un contrôle configuré pour cette date semble demander votre
   attention ». Il ne dit JAMAIS « vous n'êtes pas conforme ».

   - Aucune comparaison à une limite légale n'est faite.
   - Aucun score de conformité n'est calculé.
   - Aucune non-conformité n'est créée automatiquement.
   - `config.rules` reste une donnée de RÉFÉRENCE : elle n'est PAS consommée ici
     (décision V59 verrouillée, DEC-01).

   IDENTITÉ d'une occurrence : `controlId` + '@' + date de contrôle (ISO).
   Jamais la position dans un tableau, jamais le libellé affiché. Une nouvelle
   date applicable = une nouvelle occurrence.

   ÉTATS : `unresolved` (aucune décision) · `resolved` (un VRAI enregistrement
   existe) · `dismissed` (ignorée POUR CETTE occurrence) · `deferred` (plus
   tard, toujours visible le jour même). « Plus tard » et « Ignorer » ne
   suppriment JAMAIS les occurrences futures.

   PERSISTANCE : `config.alertDecisions` — une petite structure ADDITIVE de
   configuration. Aucun nouveau magasin, aucune base, et la décision porte sur
   l'ATTENTE, jamais sur l'enregistrement opérationnel qui reste la source. */

function alertKey(controlId,iso){return String(controlId)+'@'+String(iso)}
function alertDecisions(){return (config.alertDecisions&&typeof config.alertDecisions==='object'&&!Array.isArray(config.alertDecisions))?config.alertDecisions:{}}
function alertDecision(controlId,iso){
  var d=alertDecisions()[alertKey(controlId,iso)];
  return (d&&(d.state==='dismissed'||d.state==='deferred'))?d.state:'unresolved'
}
function setAlertDecision(controlId,iso,state){
  config.alertDecisions=alertDecisions();
  var k=alertKey(controlId,iso);
  if(state==='dismissed'||state==='deferred')config.alertDecisions[k]={state:state,at:now().stamp};
  else delete config.alertDecisions[k];
  save()
}
function clearAlertDecision(controlId,iso){
  config.alertDecisions=alertDecisions();
  delete config.alertDecisions[alertKey(controlId,iso)];
  save()
}

/* ---- RÉALISATION : un VRAI enregistrement existant, rien d'autre ---- */
function dailyTickFor(id,d){
  return records.filter(function(r){return r.module==='daily_tick'&&r.iso===d&&r.data&&r.data.taskId===id&&!r.data.cancelled})
    .sort(function(a,b){return b.createdAt.localeCompare(a.createdAt)})[0]||null
}
/* Un point de température n'est réalisé que si SON équipement a réellement
   été mesuré : on relit l'enregistrement existant par son NOM. */
function tempPointRecorded(p,d){
  var eq=tempPointEquipment(p);
  if(!eq)return false;
  var tid=(p.moment==='mid')?'fridge_mid':'fridge_open';
  var rec=dailyTickFor(tid,d);
  if(!rec||!Array.isArray(rec.data.readings))return false;
  /* on relit l'enregistrement existant par le NOM d'equipement : aucune
     reecriture, aucune cle de stockage nouvelle, aucun index de tableau. */
  return rec.data.readings.some(function(rd){
    return rd&&rd.equipment===eqName(eq)&&rd.temperature!=null&&String(rd.temperature).trim()!==''
  })
}

/* ---- OCCURRENCES ATTENDUES (extension de `expectedControls()` de SET-2) ----
   SET-2 fournit les contrôles quotidiens et les points de température.
   SET-3 y ajoute les contrôles « occasionnels » qui ne deviennent attendus QUE
   si l'opérateur a explicitement indiqué des jours (sinon : aucune exigence
   automatique).

   V59.2 · D-8 — DEUX CATÉGORIES RETIRÉES d'ici, délibérément :

   (A) Les PLATS DU MENU. Un plat non contrôlé était annoncé deux fois sur le
       même écran : dans « À vérifier » ET dans « Contrôles du menu », avec deux
       vocabulaires et deux jeux d'actions différents. « Contrôles du menu »
       (L1478) reste l'écran RÉFÉRENT du contrôle HACCP d'un plat : il porte le
       `✓ FAIRE` et affiche déjà l'état réel. Rien n'est perdu, et les plats
       cessent d'occuper le quota d'affichage de « À vérifier ».

   (C1) Les LOTS. Une alerte de lot n'est PAS une attente de contrôle non
       réalisée : c'est une DÉCISION d'opérateur. Sa seule issue était
       `lotIsArchived()` — donc un lot échu non archivé réapparaissait à CHAQUE
       jour d'ouverture, indéfiniment, sans action « garder actif » possible
       dans cette carte. La gestion des lots appartient à la TRAÇABILITÉ, où
       `archiveLot()` / `restoreLot()` font autorité et existent déjà.

   AUCUNE donnée n'est retirée : `config.menus`, `config.traceLots`, les
   enregistrements `menu_dish_control` et les archives de lots sont
   intacts. Seule la DÉRIVATION de ces deux familles d'occurrences est
   supprimée. */
function expectedOccurrences(d){
  d=d||today();
  var base=expectedControls(d);
  if(base.closed)return {date:d,closed:true,items:[]};
  var items=[];
  base.expected.forEach(function(e){var cid=e.controlId||e.key;   /* SET-2 renseigne `key` */
    items.push({key:cid+'@'+d,controlId:cid,label:e.label,kind:e.kind,activity:e.activity,expectedOn:d,link:e.link})});
  /* contrôles OCCASIONNELS : attendus seulement si des jours sont configurés */
  dailyConfigList().forEach(function(t){
    if(dailyActivityStatus(t.id)!=='OCCASIONNEL')return;
    if(!t.weekdays.length)return;                       /* aucune exigence automatique */
    if(!dailyAppliesOnDay(t,d))return;
    if(!dailyHasRealTarget(t))return;
    items.push({key:'daily:'+t.id,controlId:'daily:'+t.id,label:t.label||t.title,kind:'daily',activity:DAILY_ACTIVITY[t.id]||'',expectedOn:d,link:'daily'})
  });
  /* dédoublonnage par identité naturelle (jamais par position) */
  var seen={},out=[];
  items.forEach(function(i){if(seen[i.key])return;seen[i.key]=1;out.push(i)});
  return {date:d,closed:false,items:out}
}

/* Une occurrence est RÉALISÉE s'il existe un vrai enregistrement correspondant. */
function occurrenceRecorded(it){
  var d=it.expectedOn;
  /* `expectedControls()` (SET-2) produit kind==='temperature' : les DEUX
     libelles sont acceptes pour ne pas dependre d une convention fragile. */
  if(it.kind==='temp'||it.kind==='temperature'){
    var p=tempPointsList().filter(function(x){return 'temp:'+x.id===it.controlId})[0];
    return p?tempPointRecorded(p,d):false
  }
  if(it.kind==='dish')return dishRecorded(it.menuItemId,d);
  if(it.kind==='lot'){var lo=lotById(it.lotId||it.controlId.replace('lot:',''));return lo?lotIsArchived(lo):true}
  if(it.controlId==='daily:cleaning_end')return cleaningRecorded(d);
  if(it.controlId==='daily:samples')return samplesRecorded(d);
  return dailyRecord(it.controlId.replace('daily:',''),d).kind==='done'
}
function occurrenceState(it){
  if(occurrenceRecorded(it))return 'resolved';
  return alertDecision(it.controlId,it.expectedOn)
}
/* Les alertes AFFICHABLES pour une date : non réalisées, non ignorées, non reportées.

   V59.2 · BATCH 2 — « Plus tard » SUPPRIME l'occurrence POUR CETTE DATE.
   `deferAlert()` écrit une décision d'occurrence `controlId@ISO` dans
   `config.alertDecisions`. Une décision est donc naturellementattachée à UNE
   seule date : l'ignorer ici n'a aucun effet sur les autres jours, et le même
   contrôle sera de nouveau signalé le jour suivant où il est attendu.

   C'est exactement le contrat SET-3 (« deferred → suppressed, may return »
   — V59_3 §17.1 ; « deferring lets a new occurrence appear the next day »
   — V59_3 SET-3). Auparavant l'état `deferred` était renvoyé dans la liste,
   ce qui rendait le bouton « Plus tard » sans effet visible.

   AUCUN enregistrement, AUCUNE non-conformité, AUCUNE réalisation
   automatique n'est produit : une attente différée reste une attente. */
function alertsFor(d){
  d=d||today();
  var e=expectedOccurrences(d);
  if(e.closed)return [];
  return e.items.filter(function(it){
    /* 'unresolved' uniquement : 'resolved' = un vrai enregistrement existe,
       'dismissed' = « Ignorer », 'deferred' = « Plus tard ». */
    return occurrenceState(it)==='unresolved'
  }).map(function(it){
    return {key:it.key,controlId:it.controlId,label:it.label,kind:it.kind,activity:it.activity,
      date:it.expectedOn,state:occurrenceState(it),link:it.link,menuItemId:it.menuItemId}
  })
}
function alertCountFor(d){return alertsFor(d).length}
function alertDayLabel(iso){var d=new Date(iso+'T12:00:00');return isNaN(d.getTime())?iso:d.toLocaleDateString('fr-FR')}

/* Navigation depuis une alerte vers l'écran réellement concerné. */
function openAlert(controlId,d){
  var kind=controlId.split(':')[0];
  if(kind==='temp'){
    var p=tempPointsList().filter(function(x){return 'temp:'+x.id===controlId})[0];
    fridgeDailyPage(p&&p.moment==='mid'?'fridge_mid':'fridge_open');return
  }
  if(kind==='lot'){var lo=lotById(controlId.slice(4));if(lo)traceLotPage(lo.id);else home();return}
  if(kind==='dish'){var id=controlId.slice(5);var menu=(config.menus&&config.menus[d])||[];var it=menuFilled(menu).filter(function(x){return x&&x.id===id})[0];if(it)menuTaskPage('dish_'+d+'_'+id);else home();return}
  var tid=controlId.replace('daily:','');
  if(tid==='samples'){samplesDailyPage();return}
  if(tid==='cleaning_end'){cleaningDailyPage();return}
  if(tid==='fridge_open'||tid==='fridge_mid'){fridgeDailyPage(tid);return}
  quickDaily(tid)
}
/* V59.2 · BATCH 1 : le libellé n'affirme plus « Résoudre ».
   `openAlert()` est une NAVIGATION pure (il ouvre l'écran du contrôle
   concerné) : il n'écrit aucun enregistrement, ne modifie aucun état
   d'alerte et ne crée aucune non-conformité. Un bouton portant le mot
   « Résoudre » laissait croire qu'une occurrence était close. L'occurrence
   ne devient `resolved` que par un ENREGISTREMENT RÉEL
   (`occurrenceRecorded()`), donc par le travail de l'opérateur lui-même.
   La navigation est INCHANGÉE. */
function alertActionsHtml(a){
  return '<button class="tap" onclick="openAlert(\''+a.controlId+'\',\''+a.date+'\')">Ouvrir</button>'
   +'<button class="tap" onclick="deferAlert(\''+a.controlId+'\',\''+a.date+'\')">Plus tard</button>'
   +'<button class="tap" onclick="dismissAlert(\''+a.controlId+'\',\''+a.date+'\')">Ignorer cette occurrence</button>'
}
function deferAlert(controlId,iso){setAlertDecision(controlId,iso,'deferred');home()}
function dismissAlert(controlId,iso){
  if(!confirm('Ignorer CETTE occurrence du '+alertDayLabel(iso)+' ?\n\nCe contrôle reste attendu et signalera à nouveau les jours suivants. « Ignorer » ne désactive jamais le contrôle.'))return;
  setAlertDecision(controlId,iso,'dismissed');home()
}

function dishRecorded(menuItemId,d){
  var menu=(config.menus&&config.menus[d])||[];
  var it=menuFilled(menu).filter(function(x){return x&&x.id===menuItemId})[0];
  if(!it)return false;
  /* BATCH 2 : la date `d` est transmise — un contrôle de plat enregistré un
     AUTRE jour ne satisfait plus cette occurrence. */
  return !!dishRecord(it,d)      /* matcher existant, par menuItemId */
}
function cleaningRecorded(d){
  return !!records.filter(function(x){return x.module==='cleaning_session'&&x.iso===d&&x.data&&!x.data.cancelled})[0]
}
/* V59.2 · SET-3 : UN plat témoin ACTIF par date (le repas daté complet).
   Les enregistrements historiques (un par plat) restent lisibles et valides. */
function sampleRecordFor(d){
  return records.filter(function(r){return r.module==='samples'&&r.iso===d&&r.data&&!r.data.cancelled})
    .sort(function(a,b){return b.createdAt.localeCompare(a.createdAt)})[0]||null
}
function sampleCovers(rec,menuItemId){
  if(!rec||!rec.data)return false;
  if(Array.isArray(rec.data.mealItems))return rec.data.mealItems.some(function(m){return m&&m.menuItemId===menuItemId});
  return rec.data.menuItemId===menuItemId   /* enregistrement historique */
}
function samplesRecorded(d){
  var r=sampleRecordFor(d);
  if(!r)return false;
  if(Array.isArray(r.data.mealItems))return r.data.mealItems.length>0;
  return true                              /* enregistrement historique : déjà fait */
}
/* V59.2 · SET-2 — FLUX QUOTIDIEN PILOTE PAR LA CONFIGURATION

   RÉCONCILIATION DES QUATRE SYSTÈMES DE TÂCHES EXISTANTS (aucun n'est
   supprimé, aucun cinquième n'est créé) :

   1. `daily[]` : CATALOGUE des contrôles quotidiens + routeur.
      ➜ configurable via `config.dailyTasks` (ordre, jours, actif, zone,
        équipement, libellé). AUCUNE ligne par défaut n'est écrite :
        `dailyConfigList()` synthétise la configuration manquante, donc une
        installation neuve se comporte EXACTEMENT comme avant.
   2. `cleaningPlan` : modèle RICHE conservé tel quel (FAIT / FAIT tout /
      FINIR / honnêteté de session / horodatage / historique).
   3. `customTasks` : `customDailyTasks()` était calculé mais JAMAIS rendu,
      et `completeCustomTask` n'avait AUCUN chemin d'appel → raccordés.
   4. `buildMenuTasks` : dérivés du menu daté, inchangés.

   ACTIVITÉ (`config.modules[...]`) pilotant l'affichage quotidien :
     ACTIF           → applicable, compte comme attendu

/* V59.1 : chaque item est placé sur la ligne portant SON `slot`.
   Ancien comportement : la ligne était déduite de la POSITION dans le tableau.
   Une sauvegarde restaurée dont les items sont compactés (menu sans Entrée,
   ou items réordonnés) plaçait alors le Plat sur la ligne « Entrée » :
   son `side` n'était ni affiché, ni conservé à l'enregistrement (la ligne
   « Plat » était vide, donc sans champ d'accompagnement).
   Repli : position d'origine, uniquement pour un item ancien qui ne porte pas
   de `slot` reconnu — les sauvegardes antérieures se chargent donc à l'identique.
   La structure reste [Entrée, Plat, Dessert, Goûter] : aucun item n'est ajouté,
   supprimé ni déplacé dans les données, seul l'affichage est corrigé. */
function menuRowsHtml(menu,compact){
  var h='',arr=menu||[],used=[],row=[],orphan=-1,k;
  /* V59.1 : placement en 3 temps, chaque item n'est affichee qu'une seule fois.
     1) correspondance exacte par `slot` ;
     2) un item ancien SANS `slot` mais porteur d'un `side` va sur la ligne Plat
        (sinon son accompagnement n'a pas de champ et l'enregistrement y ecrit
        `side:''`, ce qui le detruit) ;
     3) emplacements restants remplis dans l'ordre du tableau (sauvegardes
        d'origine, sans aucun `slot`). La structure reste a 4 emplacements. */
  for(k=0;k<arr.length;k++){if(arr[k]&&arr[k].name&&(arr[k].side||'').trim()&&MENU_SLOTS.indexOf(arr[k].slot)<0){orphan=k;break}}
  MENU_SLOTS.forEach(function(s,i){
    row[i]=undefined;
    for(k=0;k<arr.length;k++){if(!used[k]&&arr[k]&&arr[k].name&&arr[k].slot===s){row[i]=arr[k];used[k]=1;break}}
  });
  if(!row[1]&&orphan>=0&&!used[orphan]){row[1]=arr[orphan];used[orphan]=1}
  MENU_SLOTS.forEach(function(s,i){
    if(row[i])return;
    for(k=0;k<arr.length;k++){if(!used[k]&&arr[k]&&arr[k].name){row[i]=arr[k];used[k]=1;break}}
  });
  MENU_SLOTS.forEach(function(s,i){h+=menuRow(row[i]||{name:'',type:i===1?'hot':'ready',slot:s},i,s,compact)});
  return h
}

  if(!isPhotoDataUrl(original))return Promise.resolve({ok:false,photoId:a.photoId||null,reason:'image absente ou malformée'});
  var photoId=a.photoId||newPhotoId();
  return Promise.resolve(a.thumbnail||null).then(function(th){
    if(th&&!isPhotoDataUrl(th))th=null;
    return th||makePhotoThumb(original)
  }).then(function(th){
    var asset={
      photoId:photoId,
      createdAt:a.createdAt||new Date().toISOString(),
      mimeType:a.mimeType||photoMimeOf(original),
      size:photoDataBytes(original),
      thumbSize:th?photoDataBytes(th):0,
      filename:a.filename||a.name||'',
      context:typeof a.context==='string'?a.context:'',   /* informatif seul, jamais une clé */
      original:original,                                   /* TOUJOURS conservé intégralement */
      thumbnail:th                                          /* complément, jamais un remplacement */
    };
    return withPhotoStore('readwrite',function(st){return st.put(asset)})
      .then(function(r){
        if(r===null)return{ok:false,photoId:photoId,reason:'IndexedDB indisponible'};
        return{ok:true,photoId:photoId,thumb:!!th,size:asset.size}
      })
      .catch(function(e){return{ok:false,photoId:photoId,reason:(e&&e.name)||'échec d’écriture'}})
  }).catch(function(e){return{ok:false,photoId:photoId,reason:(e&&e.name)||'échec de préparation'}})
}
/* LIT un PhotoAsset, ou `null` (absent, base fermée, erreur — jamais de rejet). */
function getPhotoAsset(photoId){
  if(!photoId)return Promise.resolve(null);
  return withPhotoStore('readonly',function(st){return st.get(photoId)})
    .then(function(a){return a||null})
    .catch(function(){return null})
}
/* L'asset existe-t-il ? */
function photoExists(photoId){
  if(!photoId)return Promise.resolve(false);

    .then(function(k){return k!==null&&k!==undefined})
    .catch(function(){return false})
}
function getPhotoThumbnail(photoId){return getPhotoAsset(photoId).then(function(a){return a&&a.thumbnail?a.thumbnail:null})}
function getPhotoOriginal(photoId){return getPhotoAsset(photoId).then(function(a){return a&&a.original?a.original:null})}
/* SUPPRESSION EXPLICITE, jamais automatique. Résout {ok,deleted,reason}. */
function deletePhotoAsset(photoId){
  if(!photoId)return Promise.resolve({ok:false,deleted:false,reason:'photoId absent'});
  return withPhotoStore('readwrite',function(st){return st.delete(photoId)})
    .then(function(r){
      if(r===null)return{ok:false,deleted:false,photoId:photoId,reason:'IndexedDB indisponible'};
      return{ok:true,deleted:true,photoId:photoId}
    })
    .catch(function(e){return{ok:false,deleted:false,photoId:photoId,reason:(e&&e.name)||'échec'}})
}
/* Résout le data-URL d'une pièce jointe : INLINE D'ABORD (données
   historiques, jamais modifiées), sinon IndexedDB. Ne modifie RIEN. */
function photoDataOf(att){
  att=att||{};
  if(att.data)return Promise.resolve(att.data);
  if(!att.photoId)return Promise.resolve(null);
  return getPhotoOriginal(att.photoId)
}
/* Intégration `readFiles()` : tente IndexedDB pour CHAQUE nouvelle photo.
   • succès → référence {photoId, name, type, asset:true} SANS base64 ;
   • échec  → retour EXACT au comportement inline actuel (base64 conservée),
     donc aucune photo ne peut être perdue par unIndexedDB défaillant.
   Les deux formes restent lisibles grâce à `photoDataOf()`. */
function storeNewPhotos(list){
  list=list||[];
  if(!list.length)return Promise.resolve(list);
  return Promise.all(list.map(function(a){
    if(!a||!a.data)return a;
    return savePhotoAsset({photoId:a.photoId,filename:a.name,mimeType:a.type,original:a.data})
      .then(function(r){return r.ok?{photoId:r.photoId,name:a.name,type:a.type,asset:true}:a})
  })).then(function(out){return out})

/* Liste les photoId RÉFÉRENCÉS par config + records, sans doublon, sans
   rien modifier (ordre de parcours stable). */
function referencedPhotoIds(){
  var ids=[],seen=Object.create(null);
  function push(a){
    if(!a||typeof a!=='object')return;
    var id=a.photoId;
    if(id&&!seen[id]){seen[id]=1;ids.push(id)}
  }
  (config.ingredients||[]).forEach(function(g){push(g&&g.photo)});
  (config.traceLots||[]).forEach(function(l){if(l&&Array.isArray(l.attachments))l.attachments.forEach(push)});
  records.forEach(function(r){
    if(!r)return;
    if(Array.isArray(r.attachments))r.attachments.forEach(push);

/* Collecte les assets RÉFÉRENCÉS pour la sauvegarde. La section n'est
   ajoutée que s'il y a des photos à transporter : une sauvegarde sans
   photo reste byte-compatible avec le format actuel. */
function collectPhotoAssets(){
  var ids=referencedPhotoIds();

  return Promise.all(ids.map(getPhotoAsset)).then(function(l){return l.filter(Boolean)})
}
/* Restore : réécrit les assets livrés par la sauvegarde, dans l'IDENTITÉ

function restorePhotoAssets(assets){
  var list=Array.isArray(assets)?assets:[];
  if(!list.length)return Promise.resolve({ok:true,restored:0,missing:0});
  return openPhotoDB().then(function(db){
    if(!db)return{ok:false,restored:0,missing:list.length,reason:'IndexedDB indisponible'};
    return withPhotoStore('readwrite',function(st){
      list.forEach(function(a){
        if(!a||typeof a!=='object'||!a.photoId||!isPhotoDataUrl(a.original))return;
        st.put({
          photoId:a.photoId,
          createdAt:a.createdAt||new Date().toISOString(),
          mimeType:a.mimeType||photoMimeOf(a.original),
          size:(typeof a.size==='number')?a.size:photoDataBytes(a.original),
          thumbSize:(typeof a.thumbSize==='number')?a.thumbSize:(isPhotoDataUrl(a.thumbnail)?photoDataBytes(a.thumbnail):0),
          filename:a.filename||'',context:typeof a.context==='string'?a.context:'',
          original:a.original,thumbnail:isPhotoDataUrl(a.thumbnail)?a.thumbnail:null

    }).then(function(){return{ok:true,restored:list.length,missing:0}})
      .catch(function(e){return{ok:false,restored:0,missing:list.length,reason:(e&&e.name)||'échec'}})

/* Photo(s) référencée(s) dont l'asset ET le base64 sont absents : diagnostic
   de perte, sans jamais modifier les enregistrements. */
function auditMissingPhotos(){
  var ids=referencedPhotoIds();
  if(!ids.length)return Promise.resolve({total:0,missing:[]});
  return Promise.all(ids.map(function(id){
    var inline=false;
    try{
      (config.ingredients||[]).forEach(function(g){if(g&&g.photo&&g.photo.photoId===id)inline=true});
      (config.traceLots||[]).forEach(function(l){(l&&l.attachments||[]).forEach(function(a){if(a&&a.photoId===id)inline=true})});
      records.forEach(function(r){(r&&r.attachments||[]).forEach(function(a){if(a&&a.photoId===id&&a.data)inline=true});if(r&&r.attachment&&r.attachment.photoId===id&&r.attachment.data)inline=true});
    }catch(e){}
    if(inline)return Promise.resolve(null);
    return photoExists(id).then(function(ex){return ex?null:id})
  })).then(function(l){return{total:ids.length,missing:l.filter(Boolean)}})
}
/* COPIE NON DESTRUCTIVE d'une photo historique inline vers IndexedDB.
   Le `data` inline N'EST JAMAIS SUPPRIMÉ : la copie est relue et comparée
   avant de résoudre ok:true. La suppression du base64 est VOLONTAIREMENT
   hors périmètre de Y-10C (cf. rapport § « migration »). */
function migrateLegacyPhotoIfSafe(att,context){
  att=att||{};
  if(!isPhotoDataUrl(att.data))return Promise.resolve({ok:false,reason:'pas de photo inline exploitable'});
  return savePhotoAsset({photoId:att.photoId,filename:att.name,mimeType:att.type,original:att.data,context:context||''})
    .then(function(r){
      if(!r.ok)return r;
      return getPhotoOriginal(att.photoId||r.photoId).then(function(back){
        if(back!==att.data)return{ok:false,photoId:r.photoId,reason:'relecture différente — copie non confirmée'};
        return{ok:true,photoId:r.photoId,inlineRetained:true}
      })
    })

/* ==========================================================================
   V59.1 (Y-10) : COMPLÉTUDE PHOTO (P9 / P10)
   --------------------------------------------------------------------------
   P9 : une photo de LOT ou d'INGRÉDIENT doit réellement s'ouvrir.
        `viewAttachment()` ne cherchait que dans `records` : un bouton de lot
        était donc un « no-op » silencieux. Les ingrédients n'avaient
        AUCUNE affordance d'affichage.

        enregistrements. Il doit contenir TOUTES les sources, avec un
        MANIFESTE lisible.

     • AUCUN photoId régénéré, AUCUNE déduplication par contenu, AUCUN

     • une référence résout TOUJOURS le même PhotoAsset ;
     • un asset manquant n'est JAMAIS remplacé par une autre image ;
     • les photos historiques inline ne sont ni supprimées ni réécrites ;

function photoOwnerByKind(kind,id){

  if(kind==='lot')return (config.traceLots||[]).find(function(x){return x&&x.id===id})||null;

/* Pièces jointes d'un propriétaire, quelle que soit sa nature. */
function photoOwnerAtts(kind,o){

    var out=[];
    if(o.photo)out.push(o.photo);

function photoOwnerLabel(kind,o){

/*__Y10_D__*/
/* ---------- P10 : index COMPLET des références photo (lecture seule) ---------- */
/* Regroupe TOUTES les sources : enregistrements, lots, ingrédients.
   Une même photo référencée plusieurs fois apparaît PLUSIEURS fois (une ligne
   par référence) mais ne sera exportée qu'UNE seule fois. */
function collectPhotoRefs(){
  var refs=[];
  records.forEach(function(r){
    attachmentsOf(r).forEach(function(a,i){
      if(a)refs.push({att:a,source:'record',owner:r,ref:'attachments['+i+']'+(r.attachment===a?' (attachment)':'')})
    })
  });
  (config.traceLots||[]).forEach(function(l){
    (Array.isArray(l.attachments)?l.attachments:[]).forEach(function(a,i){
      if(a)refs.push({att:a,source:'lot',owner:l,ref:'attachments['+i+']'})
    })
  });
  (config.ingredients||[]).forEach(function(g){
    if(!g)return;
    if(g.photo)refs.push({att:g.photo,source:'ingredient',owner:g,ref:'photo'});
    (Array.isArray(g.attachments)?g.attachments:[]).forEach(function(a,i){
      if(a)refs.push({att:a,source:'ingredient',owner:g,ref:'attachments['+i+']'})
    });

/* Nom de fichier ASCII (buildZip n'écrit pas le drapeau UTF-8). */
function zipSafeName(s){var v=String(s==null?'':s).replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'');return v.slice(0,90)||'x'}
/* Nom d'export déterministe : source + contexte + nom d'origine + photoId.
   Le photoId rend la collision impossible ; le contexte reste lisible. */
function photoExportName(ref,key){
  var a=ref.att,o=ref.owner||{},base=String(a.name||'photo');
  var stem=base.replace(/\.[^.]*$/,'');
  var ext=(/\.([A-Za-z0-9]{2,5})$/.exec(base)||[])[1]||String(a.type||'').split('/')[1]||'bin';
  var ctx=ref.source==='record'?((o.module||'rec')+'_'+(o.iso||''))
        :ref.source==='lot'?('lot_'+(o.lot||o.product||'x'))
        :('ing_'+zipSafeName(o.name||'x'));
  return zipSafeName([ref.source,ctx,stem,key].join('_')+'.'+zipSafeName(ext).toLowerCase())
}
function csvCell(v){var s=String(v==null?'':v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function photoManifestCsv(rows){
  var head='photoId,fichier,nom,type_mime,taille_octets,source,contexte,reference,date_creation,stockage,statut';
  return head+'\n'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n')+'\n'

/*__Y10_E__*/
function photoManifestText(rows,sum){

/* ZIP COMPLET : toutes les photos + manifeste.csv + manifeste.txt.
   Résout {ok, missing, total, files, rows, zip}. */
function buildCompletePhotoZip(){
  var refs=collectPhotoRefs();
  if(!refs.length)return Promise.resolve({ok:0,missing:0,total:0,files:[],rows:[]});
  var groups=Object.create(null),order=[];
  refs.forEach(function(ref,i){
    var key=(ref.att&&ref.att.photoId)||('sans_photoId_'+i);
    if(!groups[key]){groups[key]={key:key,att:ref.att,refs:[],data:null,asset:null};order.push(key)}
    groups[key].refs.push(ref)
  });
  return Promise.all(order.map(function(k){
    var g=groups[k];
    return photoDataOf(g.att).then(function(d){
      g.data=d;
      if(d&&!g.att.data&&g.att.photoId)return getPhotoAsset(g.att.photoId).then(function(x){g.asset=x;return g});
      return g
    })
  })).then(function(list){
    var files=[],rows=[],ok=0,missing=0,used=Object.create(null);
    list.forEach(function(g){
      var a=g.att,exported='';
      if(g.data){
        var name=photoExportName(g.refs[0],g.key),n=1;
        while(used[name]){n++;name=photoExportName(g.refs[0],g.key+'_dup'+n)}
        used[name]=true;
        try{files.push({name:name,bytes:dataURLToBytes(g.data)});exported=name;ok++}catch(e){exported=''}
      }else missing++;
      var created=(g.asset&&g.asset.createdAt)||'';
      g.refs.forEach(function(ref){
        rows.push([a.photoId||'',exported,a.name||'',a.type||'',
          g.data?String(photoDataBytes(g.data)):'',
          ref.source,photoOwnerLabel(ref.source,ref.owner),ref.ref,created,
          a.data?'inline':(a.photoId?'indexeddb':'inconnu'),
          exported?'OK':'MISSING'])

    });
    var sum={ok:ok,missing:missing,total:order.length,files:files,rows:rows};
    if(ok)sum.zip=buildZip(files.concat([
      {name:'manifeste.csv',bytes:strToBytes(photoManifestCsv(rows))},
      {name:'manifeste.txt',bytes:strToBytes(photoManifestText(rows,sum))}
    ]));
    return sum
  })
}
function downloadPhotosZip(){

    if(sum.missing)alert('⚠️ ZIP des photos créé.\n\n'+sum.ok+' photo(s) exportée(s).\n\n'+sum.missing+' référence(s) pointent vers une photo introuvable : elles sont listées dans le manifeste avec le statut MISSING et ne sont remplacées par aucune autre image.')

function traceId(){return 'lot_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function traceLotLabel(l){return (l.product||'Produit')+(l.lot?' · Lot '+l.lot:'')+(l.dlc?' · DLC '+l.dlc:'')+(l.ddm?' · DDM '+l.ddm:'')+(l.supplier?' · '+l.supplier:'')}
function traceRegisterPage(){

      config.traceLots=config.traceLots||[];
      /* V59.1 · Y-10E (Phase A) — lot créé par une livraison :
         - `product`  = produit RÉEL de la livraison (plus jamais le littéral

         - `deliveryId` = lien EXPLICITE vers l'enregistrement de livraison ;

         - un lot déjà connu peut être RÉUTILISÉ (un lot physique = un lot) :

         - `product` (nom) reste écrit : l'historique reste lisible. */
      var picked=document.getElementById('dlIngredient')?.value||'';

      var ing=picked?ingredientById(picked):(d.product?ingredientByName(d.product):null);
      var existing=reuse?lotById(reuse):null;

        config.traceLots.push(lot);

function saveNc(){

  var tIso=document.getElementById('ncTime').value;
  var constat=(document.getElementById('ncConstat').value||'').trim();
  if(!dIso){alert('Indiquez la date du contrôle.');return}
  if(!tIso){alert('Indiquez l’heure du contrôle.');return}
  if(!constat){alert('Décrivez la non-conformité constatée.');return}
  /* Les valeurs du formulaire sont relevées MAINTENANT, avant la lecture
     asynchrone des fichiers : après `readFiles`, la page a pu être
     re-rendue et les champs ne seraient plus disponibles. */
  var v={activite:(document.getElementById('ncActivite').value||'').trim(),
         produit:(document.getElementById('ncProduit').value||'').trim(),
         constat:constat,
         actionImmediate:(document.getElementById('ncActionImm').value||'').trim(),
         actionCorrective:(document.getElementById('ncActionCorr').value||'').trim(),
         suivi:(document.getElementById('ncSuivi').value||'').trim(),
         operator:(document.getElementById('operator')||{}).value||''};
  var btn=document.getElementById('ncSaveBtn');
  if(btn){btn.disabled=true;btn.textContent='Enregistrement…'}
  readFiles('ncFiles',5000000).then(function(atts){
    if(atts===null){if(btn){btn.disabled=false;btn.textContent='✓ Enregistrer la non-conformité'}return}
    var n=now();
    var d={etat:'Non conforme',activite:v.activite,produit:v.produit,constat:v.constat,
      actionImmediate:v.actionImmediate,actionCorrective:v.actionCorrective,suivi:v.suivi,operator:v.operator};
    records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:'nc',
      createdAt:n.stamp,iso:dIso,date:isoToFR(dIso),time:tIso+':00',
      operator:d.operator,data:d,attachment:null,attachments:atts||[],corrections:[]});
    if(!save())return;home()
  })
}

    p.actions=p.actions||[];

function validateBackup(text){

  if(p.app!==APP_ID)return{ok:false,reason:'Ce fichier provient d’une autre application (« '+(p.app==null?'non identifiée':String(p.app))+' »). Il a été refusé.'}

  if(!Array.isArray(p.records))return{ok:false,reason:'La section « records » n’est pas une liste. La sauvegarde a été refusée.'}
  var sv=backupSchemaOf(p);
  if(isNaN(sv))return{ok:false,reason:'Le numéro de schéma de la sauvegarde est illisible. Elle a été refusée.'}
  if(sv>SCHEMA_VERSION)return{ok:false,reason:'Cette sauvegarde utilise le schéma v'+sv+', plus récent que le schéma v'+SCHEMA_VERSION+' de cette application. Elle a été refusée pour éviter une perte de données.'}
  if(sv<SCHEMA_VERSION&&sv!==0)return{ok:false,reason:'Cette sauvegarde utilise le schéma v'+sv+', non pris en charge par cette application (v'+SCHEMA_VERSION+'). Elle a été refusée pour éviter une perte de données.'}
  if(sv===0&&p.config.schemaVersion!=null)return{ok:false,reason:'La sauvegarde est incohérente (schéma absent de l’en-tête mais présent dans la configuration). Elle a été refusée.'}
  /* Contrôle de forme enregistrement par enregistrement : on refuse, on ne répare pas. */
  for(var i=0;i<p.records.length;i++){
    var r=p.records[i];
    if(!r||typeof r!=='object'||Array.isArray(r))return{ok:false,reason:'L’enregistrement n°'+(i+1)+' n’est pas un objet valide. Sauvegarde refusée.'}
    if(typeof r.id!=='string'||!r.id)return{ok:false,reason:'L’enregistrement n°'+(i+1)+' n’a pas d’identifiant. Sauvegarde refusée.'}
    if(typeof r.module!=='string'||!r.module)return{ok:false,reason:'L’enregistrement n°'+(i+1)+' n’a pas de rubrique (module). Sauvegarde refusée.'}
    if(r.data!=null&&(typeof r.data!=='object'||Array.isArray(r.data)))return{ok:false,reason:'L’enregistrement n°'+(i+1)+' a des données invalides. Sauvegarde refusée.'}

  }

  if(p.config.cleaningPlan!=null&&!Array.isArray(p.config.cleaningPlan))return{ok:false,reason:'Le plan de nettoyage est invalide. Sauvegarde refusée.'}
  if(p.config.preparations!=null&&!Array.isArray(p.config.preparations))return{ok:false,reason:'La liste des préparations est invalide. Sauvegarde refusée.'}
  if(p.config.traceLots!=null&&!Array.isArray(p.config.traceLots))return{ok:false,reason:'Le registre des lots est invalide. Sauvegarde refusée.'}

}

/* V59.1 · Y-06 (P18) : sans garde, décocher les 7 jours rendait TOUTES les dates

   L'enregistrement est désormais bloqué derrière une confirmation explicite.
   Chemin de reprise déjà présent et vérifié : l'écran « jour fermé » contient la
   tuile Paramètres, qui mène à ces cases à cocher. */
function saveOpenDays(){var a=[].slice.call(document.querySelectorAll('.openDay:checked')).map(function(x){return Number(x.value)});if(!a.length){if(!confirm('Aucun jour d’ouverture ne sera enregistré.\n\nTOUTES les dates seront alors considérées comme fermées et l’application affichera en permanence l’écran « cantine fermée ».\n\nVoulez-vous vraiment enregistrer zéro jour d’ouverture ? Vous pourrez revenir les corriger dans Paramètres.')){settings();return}}config.schedule=config.schedule||{closures:[],holidays:[]};config.schedule.weekdays=a;save();settings()}
/* V59.2 · SET-1 : l'ajout ne se base plus sur `indexOf` de chaînes (cassé dès
   que l'entrée est un objet). L'identité est posée ICI, une fois, et n'est plus
   jamais regénérée. */
function eqAdd(name,type){
  name=String(name||'').trim();if(!name)return null;
  config.equipment=normaliseEquipment(config.equipment||[]);
  var n=1,cand=name;
  while(config.equipment.some(function(x){return x.name===cand})){n++;cand=name+' '+n}
  var e={id:eqNewId(cand,config.equipment),name:cand,type:eqTypeValid(type)?type:'',active:true,area:'',note:''};
  config.equipment.push(e);save();return e
}
function addEquipmentPreset(name,type){if(eqAdd(name,type||'neutral'))settings()}
function addCustomEquipment(){var v=document.getElementById('newEquipment').value.trim();if(!v)return;eqAdd(v,'');settings()}
/* Supprimer ne touche QUE la configuration : les relevés historiques
   conservent leur nom d'équipement et restent lisibles/recherchables. */
function removeEquipment(i){var e=config.equipment[i];if(!e)return;
  if(!confirm('Retirer « '+eqName(e)+' » de la configuration ?\n\nLes relevés historiques qui portent ce nom sont CONSERVÉS et restent consultables. Pour le masquer sans le supprimer, utilisez plutôt « Désactiver ».'))return;
  config.equipment.splice(i,1);save();settings()}
/* Le renommage PRÉSERVE l'identifiant : c'est l'identité, pas le nom, qui lie
   l'équipement. Les relevés passés gardent leur nom d'origine : aucune
   réécriture d'enregistrement n'est faite. */
function renameEquipment(i){var e=config.equipment[i];if(!e)return;var old=eqName(e);
  var v=prompt('Nom de l’équipement :',old);if(v===null||!v.trim())return;var nn=v.trim();
  if(nn===old){settings();return}
  if(config.equipment.some(function(x,j){return j!==i&&x.name===nn})){alert('Un autre équipement porte déjà ce nom. Choisissez un nom différent pour ne pas confondre les identités.');return}
  e.name=nn;save();settings()}
function setEquipmentType(i,v){var e=config.equipment[i];if(!e)return;e.type=eqTypeValid(v)?v:'';save();settings()}
function toggleEquipment(i){var e=config.equipment[i];if(!e)return;e.active=e.active===false;save();settings()}
function editEquipment(i){var e=config.equipment[i];if(!e)return;
  var a=prompt('Zone / emplacement (facultatif) :',e.area||'');if(a!==null)e.area=a.trim();
  var nt=prompt('Note (facultatif) :',e.note||'');if(nt!==null)e.note=nt.trim();
  save();settings()}
function equipmentTypeSelect(i,e){var s='<select class="eqType" onchange="setEquipmentType('+i+',this.value)">';
  s+='<option value=""'+(!eqTypeValid(e.type)?' selected':'')+'>— Type non défini —</option>';
  EQ_TYPES.forEach(function(t){s+='<option value="'+t.id+'"'+(e.type===t.id?' selected':'')+'>'+esc(t.label)+'</option>'});
  return s+'</select>'}
/* ============ V59.1 · Y-07 — RAPPORT JOURNALIER IMPRIMABLE ============
   Lecture seule : n'écrit aucun enregistrement et ne modifie aucun module.
   Le rapport est construit UNIQUEMENT à partir des enregistrements
   réellement persistés,_selected par leur DATE DE CONTRÔLE `r.iso`
   (modèle à deux dates, P3/Y-13). `createdAt` n'est affiché que comme
   horodatage de saisie, séparé de la date de contrôle.
   Aucun contrôle n'est inventé. AUCUN jugement de conformité n'est calculé :
   l'application ne compare aucune valeur à un seuil (P24) ; le rapport
   restitue uniquement ce que l'opérateur a réellement saisi. */
var Y07_SEL='';
function y07_workIso(){return /^\d{4}-\d{2}-\d{2}$/.test(String(config.workDate||''))?config.workDate:actualToday()}
function y07_selIso(){return /^\d{4}-\d{2}-\d{2}$/.test(String(Y07_SEL||''))?Y07_SEL:y07_workIso()}
function y07_longDate(iso){var d=new Date(iso+'T12:00:00');return isNaN(d.getTime())?isoToFR(iso):d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function y07_entryStamp(r){if(!r||!r.createdAt)return '';var d=new Date(r.createdAt);if(isNaN(d.getTime()))return '';var f=d.toLocaleDateString('fr-FR'),t=d.toLocaleTimeString('fr-FR').slice(0,5);if(f===r.date&&t===String(r.time||'').slice(0,5))return '';return 'Saisi dans l’application le '+f+' à '+t}
function y07_atts(r){return attachmentsOf(r).map(function(a,i){var img=!!(a&&a.data&&String(a.type||'').indexOf('image/')===0);return {n:(a&&a.name)||('Pièce jointe '+(i+1)),img:img,src:img?a.data:'',t:(a&&a.type)||'document'}})}
function y07_attHtml(list,forExport){
  if(!list||!list.length)return '';
  var h='';
  list.forEach(function(a){
    if(a.img)h+='<div class="y07-item"><div class="y07-att">📷 Pièce jointe : '+esc(a.n)+'</div><img class="y07-photo" alt="'+esc(a.n)+'" src="'+a.src+'"></div>';
    else h+='<div class="y07-att">📎 Pièce jointe : '+esc(a.n)+' ('+esc(a.t)+')</div>';
  });
  return h;
}
function y07_collect(iso){
  var recs=records.filter(function(r){return r&&r.iso===iso&&!(r.data&&r.data.cancelled)})
    .sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))});
  var m={iso:iso,dateFR:isoToFR(iso),dateLong:y07_longDate(iso),gen:new Date().toLocaleString('fr-FR'),
    est:(String(config.name||'').trim()||'(établissement non renseigné)'),
    fridge:[],other:[],haccp:[],ncs:[],clean:[],menuRec:null,menuObs:'',menuTime:'',menuOp:''};
  var ops=[];
  recs.forEach(function(r){[r.operator,(r.data||{}).operator].forEach(function(o){if(o&&ops.indexOf(o)<0)ops.push(o)})});
  m.ops=ops;
  recs.forEach(function(r){
    var d=r.data||{},at=y07_atts(r);
    var b={time:String(r.time||'').slice(0,5),stamp:y07_entryStamp(r),op:r.operator||d.operator||'',att:at};
    if(r.module==='daily_tick'&&(d.taskId==='fridge_open'||d.taskId==='fridge_mid')){
      m.fridge.push({label:d.label||(d.taskId==='fridge_open'?'Températures froid — arrivée / matin':'Températures froid — midi'),time:b.time,stamp:b.stamp,op:b.op,
        readings:(d.readings||[]).map(function(x){return {eq:x.equipment,t:x.temperature}}),obs:d.observation||'',corr:d.correctiveAction||'',att:b.att});
    } else if(r.module==='menu_dish_control'){
      m.haccp.push({prep:d.preparation||'',side:d.side||'',slot:d.slot||'',time:b.time,stamp:b.stamp,op:b.op,
        stages:(d.stages||[]).map(function(s){return {label:s.label||'',temp:s.temp||'',equip:s.equip||'',start:s.start||'',end:s.end||'',dur:s.duration||'',tm:s.time||'',obs:s.observation||s.obs||''}}),
        obs:d.observation||'',att:b.att});
    } else if(r.module==='nc'){
      m.ncs.push({time:b.time,stamp:b.stamp,op:b.op,act:d.activite||'',prod:d.produit||'',constat:d.constat||'',imm:d.actionImmediate||'',corr:d.actionCorrective||'',suivi:d.suivi||'',att:b.att});
    } else if(r.module==='menu_served'){
      m.menuRec=r;m.menuObs=d.observation||'';m.menuTime=b.time;m.menuOp=b.op;
    } else if(r.module==='cleaning_session'){
      m.clean.push({time:b.time,stamp:b.stamp,op:b.op,status:d.sessionStatus||'',summary:d.summary||'',att:b.att});
    } else {
      m.other.push({label:friendlyModule(r.module),time:b.time,stamp:b.stamp,op:b.op,obs:d.observation||d.check||d.constat||'',att:b.att});
    }
  });
  m.planned=menuFilled((config.menus&&config.menus[iso])||[]).map(function(x){return {id:x.id,slot:x.slot||'',name:x.name||'',side:x.side||'',type:menuTypeLabel(x.type)}});
  var items=(m.menuRec&&m.menuRec.data&&m.menuRec.data.items)||[],byId={};
  items.forEach(function(s){if(s&&s.menuItemId)byId[s.menuItemId]=s});
  m.rows=m.planned.map(function(p){
    var s=byId[p.id]||null,st=s?String(s.status||''):'',sn=(s&&s.name)?s.name:'';
    return {slot:p.slot,type:p.type,planned:p.name,served:sn,status:st,sub:st==='Remplacé',no:st==='Non servi',changed:!!sn&&sn!==p.name};
  });
  m.unrecorded=m.planned.filter(function(p){return !byId[p.id]}).map(function(p){return {slot:p.slot,name:p.name}});
  return m;
}
function y07_body(m){
  var h='';
  h+='<div class="y07-head"><h3>Rapport journalier — Cahier sanitaire</h3><div class="y07-kv">'
   +'<span><b>Établissement :</b> '+esc(m.est)+'</span>'
   +'<span><b>Date du rapport :</b> '+esc(m.dateFR)+' — '+esc(m.dateLong)+'</span>'
   +'<span><b>Responsable de la saisie :</b> '+(m.ops.length?esc(m.ops.join(', ')):'(aucun opérateur renseigné)')+'</span>'
   +'<span><b>Rapport édité le :</b> '+esc(m.gen)+'</span>'
   +'</div></div>';

  h+='<div class="y07-sec"><h3>Contrôles du froid — températures relevées</h3>';
  if(!m.fridge.length)h+='<div class="y07-empty">Aucun contrôle du froid enregistré pour cette date.</div>';
  else m.fridge.forEach(function(f){
    h+='<div class="y07-item"><div class="y07-line"><b>'+esc(f.label)+'</b> — relevé à '+esc(f.time||'heure non renseignée')+'</div>';
    if(f.stamp)h+='<div class="y07-line y07-lab">'+esc(f.stamp)+'</div>';
    if(f.op)h+='<div class="y07-line y07-lab">Opérateur : '+esc(f.op)+'</div>';
    h+='<div class="y07-tablewrap"><table class="y07-table"><thead><tr><th>Équipement</th><th>Température relevée (°C)</th></tr></thead><tbody>';
    (f.readings.length?f.readings:[{}]).forEach(function(x){h+='<tr><td>'+esc(x.eq||'—')+'</td><td>'+((x.t===''||x.t==null)?'<span class="y07-lab">—</span>':esc(String(x.t)))+'</td></tr>'});
    h+='</tbody></table></div>';
    if(f.obs)h+='<div class="y07-line"><span class="y07-lab">Observation :</span> '+esc(f.obs)+'</div>';
    if(f.corr)h+='<div class="y07-line"><span class="y07-lab">Action corrective :</span> '+esc(f.corr)+'</div>';
    h+=y07_attHtml(f.att)+'</div>';
  });
  h+='</div>';

  h+='<div class="y07-sec"><h3>Contrôles HACCP des plats</h3>';
  if(!m.haccp.length)h+='<div class="y07-empty">Aucun contrôle HACCP de plat enregistré pour cette date.</div>';
  else m.haccp.forEach(function(d){
    h+='<div class="y07-item"><div class="y07-line"><b>'+esc(d.prep||'Préparation')+'</b>'+(d.side?' <span class="y07-lab">+ '+esc(d.side)+'</span>':'')+(d.slot?' <span class="y07-lab">('+esc(d.slot)+')</span>':'')+' — contrôle à '+esc(d.time||'heure non renseignée')+'</div>';
    if(d.stamp)h+='<div class="y07-line y07-lab">'+esc(d.stamp)+'</div>';
    if(d.op)h+='<div class="y07-line y07-lab">Opérateur : '+esc(d.op)+'</div>';
    if(d.stages.length){
      h+='<div class="y07-tablewrap"><table class="y07-table"><thead><tr><th>Étape</th><th>Mesures relevées</th><th>Observation</th></tr></thead><tbody>';
      d.stages.forEach(function(s){
        var v=[];
        if(s.temp)v.push('Température : '+s.temp+' °C');
        if(s.start)v.push('Départ : '+s.start+' °C');
        if(s.end)v.push('Fin : '+s.end+' °C');
        if(s.dur)v.push('Durée : '+s.dur+' min');
        if(s.tm)v.push('Heure : '+s.tm);
        if(s.equip)v.push('Équipement : '+s.equip);
        h+='<tr><td>'+esc(s.label||'Contrôle')+'</td><td>'+(v.length?esc(v.join(' · ')):'<span class="y07-lab">—</span>')+'</td><td>'+(s.obs?esc(s.obs):'<span class="y07-lab">—</span>')+'</td></tr>';
      });
      h+='</tbody></table></div>';
    }
    if(d.obs)h+='<div class="y07-line"><span class="y07-lab">Observation :</span> '+esc(d.obs)+'</div>';
    h+=y07_attHtml(d.att)+'</div>';
  });
  h+='</div>';

  h+='<div class="y07-sec"><h3>Non-conformités signalées</h3>';
  if(!m.ncs.length)h+='<div class="y07-empty">Aucune non-conformité enregistrée pour cette date.</div>';
  else m.ncs.forEach(function(n){
    h+='<div class="y07-item"><div class="y07-line"><b>'+esc(n.act||'Événement')+'</b>'+(n.prod?' <span class="y07-lab">— '+esc(n.prod)+'</span>':'')+' — constaté à '+esc(n.time||'heure non renseignée')+'</div>';
    if(n.stamp)h+='<div class="y07-line y07-lab">'+esc(n.stamp)+'</div>';
    h+='<div class="y07-line"><span class="y07-lab">Constat :</span> '+esc(n.constat||'—')+'</div>';
    if(n.imm)h+='<div class="y07-line"><span class="y07-lab">Action immédiate :</span> '+esc(n.imm)+'</div>';
    if(n.corr)h+='<div class="y07-line"><span class="y07-lab">Action corrective :</span> '+esc(n.corr)+'</div>';
    if(n.suivi)h+='<div class="y07-line"><span class="y07-lab">Suivi :</span> '+esc(n.suivi)+'</div>';
    if(n.op)h+='<div class="y07-line y07-lab">Opérateur : '+esc(n.op)+'</div>';
    h+=y07_attHtml(n.att)+'</div>';

    m.unrecorded.forEach(function(u){h+='<li class="y07-line">'+esc(u.slot||'')+' — '+esc(u.name)+' <span class="y07-tag y07-none">Non renseigné</span></li>'});
    h+='</ul>';

function y07_exportHTML(iso){

        var val='';

    var items=Array.isArray(d.mealItems)?d.mealItems:[];
    var repas=(d.preparation||'')+(items.length>1?(' ('+items.length+' plats du repas)'):'');
    return {cells:[isoToFR(r.iso),repas,pmsTime(r),(d.retention||''),'',
      notes.join(' · '),pmsOp(r)],center:center,ht:26};
  });
  var sp=pmsHead('05_Plats_Témoins','5. PLATS TÉMOINS',ym,
    'V59 n’enregistre pas la conservation effective ni l’emplacement : colonnes laissées vides (jamais de valeur inventée).');
  sp.head=head;sp.widths=widths;sp.rows=rows;
  return sp;
}
/* 6. TRAÇABILITÉ — une ligne par lot réellement enregistré */
function pmsSheetTrace(ym){
  var recs=pmsMonthRecs(ym),out=[];
  recs.filter(function(r){return r.module==='trace'}).forEach(function(r){
    var d=r.data||{};
    (d.lots||[]).forEach(function(l){
      if(!l||!(l.product||l.lot||l.supplier||l.dlc||l.ddm))return;
      out.push({iso:r.iso,lot:l,obs:d.observation||'',op:pmsOp(r),atts:attachmentsOf(r)});
    });
  });
  recs.filter(function(r){return r.module==='deliveries'}).forEach(function(r){
    var d=r.data||{};
    if(!(d.lot||d.supplier||d.dlc||d.ddm||d.product||d.ingredientId))return;
    var p=d.ingredientId?ingredientById(d.ingredientId):null;
    out.push({iso:r.iso,lot:{product:(p?p.name:(d.product||'')),supplier:d.supplier,lot:d.lot,dlc:d.dlc,ddm:d.ddm},obs:d.observation||'',op:pmsOp(r),atts:attachmentsOf(r)});
  });
  out.sort(function(a,b){return String(a.iso).localeCompare(String(b.iso))});
  var head=['Date','Produit','Fournisseur','Lot','DLC / DDM','Réf. photo / étiquette','Observation'],
      widths=[12,24,18,16,13,26,40],center=[4];
  var rows=out.map(function(x){
    var notes=[];if(x.obs)notes.push(x.obs);if(x.op)notes.push('Op. : '+x.op);
    var ref=(x.atts||[]).map(function(a){return a&&a.name}).filter(Boolean).join(', ');
    /* Libelle HUMAIN : le produit canonique est resolu par identifiant quand
       le lien existe ; sinon le texte historique est affiche tel quel. */
    var prod=x.lot.product||'';
    var ingId=x.lot.ingredientId||'';
    if(!ingId&&x.lot.id){var lref=lotById(x.lot.id);if(lref)ingId=lref.ingredientId||''}
    if(ingId){var pi=ingredientById(ingId);if(pi)prod=pi.name}
    return {cells:[isoToFR(x.iso),prod,x.lot.supplier||'',x.lot.lot||'',pmsLotDates(x.lot),ref,notes.join(' · ')],center:center};
  });
  var sp=pmsHead('06_Traçabilité','6. TRAÇABILITÉ — PRODUITS / ÉTIQUETTES / PHOTOS',ym,
    'Lots réellement enregistrés (traçabilité du menu et réceptions). Référence photo = nom de la pièce jointe existante.');
  sp.head=head;sp.widths=widths;sp.rows=rows;
  return sp;
}
/* 7. NON-CONFORMITÉS — uniquement les NC réellement créés par l'opérateur */
function pmsSheetNC(ym){
  var recs=pmsMonthRecs(ym).filter(function(r){return r.module==='nc'});
  recs.sort(function(a,b){return String(a.iso).localeCompare(String(b.iso))||String(a.time).localeCompare(String(b.time))});
  var head=['Date','Heure','Produit / activité','Non-conformité constatée','Observation / contexte','Action immédiate','Action corrective','Résultat / suivi','Opérateur'],
      widths=[12,8,22,34,26,28,30,26,16],center=[1];
  var rows=recs.map(function(r){
    var d=r.data||{},notes=[];var en=pmsEntry(r);if(en)notes.push(en);
    return {cells:[isoToFR(r.iso),pmsTime(r),[d.produit||'',d.activite||''].filter(Boolean).join(' / '),
      d.constat||'',d.observation||notes.join(' · '),d.actionImmediate||'',d.actionCorrective||'',d.suivi||'',pmsOp(r)],
      center:center,ht:30};
  });
  var sp=pmsHead('07_NC_Actions','7. NON-CONFORMITÉS ET ACTIONS CORRECTIVES',ym,
    'Uniquement les non-conformités saisies par l’opérateur. Aucune NC n’est déduite d’une température ou d’un écart.');
  sp.head=head;sp.widths=widths;sp.rows=rows;
  return sp;
}
/* V59.2 · SET-5 : feuille « Matériel / inventaire » — une ligne par PRODUIT
   canonique, avec son nombre de lots. CONDITIONNELLE : elle n'existe que si
   un produit est réellement configuré. Aucune ligne n'est inventée. */
function pmsSheetInventory(ym){
  var prods=productList();
  if(!prods.length)return null;
  var head=['Produit','Identifiant','Type','Zone','Statut','Nombre de lots'],widths=[28,22,20,18,14,13],center=[5];
  var rows=prods.map(function(p){
    return {cells:[p.name,p.ingredientId,eqTypeValid(p.type)?eqTypeLabel(p.type):'Non défini',p.storageLocation||'',p.archived?'archivé':'actif',lotsOfProduct(p.ingredientId).length],center:center}
  });
  var sp=pmsHead('08_Matériel','8. MATÉRIEL / INVENTAIRE — PRODUITS CONFIGURÉS',ym,
    'Produits réellement configurés dans cet établissement. Une ligne par produit canonique, jamais par lot.');
  sp.head=head;sp.widths=widths;sp.rows=rows;
  return sp
}
function pmsSheets(ym){
  var list=[pmsSheetTemperatures(ym),pmsSheetCleaning(ym),pmsSheetCooking(ym),pmsSheetReception(ym),
           pmsSheetSamples(ym),pmsSheetTrace(ym),pmsSheetNC(ym)];
  var inv=pmsSheetInventory(ym);if(inv)list.push(inv);
  return list
}
/* ---- Écran : sélection du mois + génération (lecture seule) ---- */
var Y09_MONTH='';
function y09_defaultMonth(){var d=localISO(new Date());return d.slice(0,7)}
function pmsExportFilename(ym){return 'cahier-sanitaire_PMS_'+ym+'.xlsx'}
function downloadPMSMonth(ym){
  var sheets=pmsSheets(ym);
  var bytes=buildPMSWorkbookXLSX(sheets);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  triggerDownload(blob,pmsExportFilename(ym));
}
function pmsMonthPage(){
  window._returnPage=home;
  var ym=Y09_MONTH||y09_defaultMonth();
  var days=pmsServiceDays(ym);
  var counts=pmsMonthRecs(ym).length;
  var h='<div class="notice"><b>Dossier PMS mensuel</b><br>Classeur Excel (.xlsx) organisé par section PMS, structuré comme un dossier papier : '
   +'titres de sections, tableaux paysage, dates de service, libellés français.<br>'
   +'<b>Seules les données réellement enregistrées sont exportées.</b> Aucun contrôle n’est créé, aucune conformité n’est calculée. '
   +'Une cellule vide signifie « non enregistré ».</div>'
   +'<label>📅 Mois à exporter</label><input type="month" id="pmsMonth" value="'+esc(ym)+'">'
   +'<div class="muted" style="margin:8px 0">Mois : <b>'+esc(pmsMonthLabel(ym))+'</b> — jours de service configurés : <b>'+days.length+'</b> — enregistrements sur la période : <b>'+counts+'</b></div>'
   +'<button class="save" id="pmsGo">⬇️ Générer le dossier PMS (.xlsx)</button>'
   +'<div class="muted" style="margin-top:10px">Feuilles : 1 Températures · 2 Nettoyage · 3 Cuisson/Distribution · 4 Réception · 5 Plats témoins · 6 Traçabilité · 7 NC et actions.<br>'
   +'La section « 8. Vérification PMS » du modèle papier n’est <b>pas</b> produite : V59 n’a pas encore de processus opérationnel de vérification PMS.</div>';
  page('📊 Dossier PMS mensuel',h);
  var mi=document.getElementById('pmsMonth');
  if(mi)mi.onchange=function(){Y09_MONTH=this.value;pmsMonthPage()};
  var go=document.getElementById('pmsGo');
  if(go)go.onclick=function(){
    var v=(document.getElementById('pmsMonth')||{}).value||y09_defaultMonth();
    Y09_MONTH=v;
    downloadPMSMonth(v);   /* ne modifie PAS config.workDate */
  };
}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('fr-FR')}setInterval(tick,1000);tick();home();
